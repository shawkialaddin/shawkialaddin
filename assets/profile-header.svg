<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="1200" height="420" role="img" aria-labelledby="title desc"><title id="title">Shawki Aladdin</title><desc id="desc">Software engineer and founder. CTO at Digital Harbor. Founder of gitroots. Green contribution cells continuously disperse and reassemble in the accompanying portrait.</desc><rect width="1200" height="420" fill="#101114"/><g fill="#edeeec" font-family="Arial,sans-serif"><text x="48" y="65" font-family="monospace" font-size="11" letter-spacing="4">SHAWKI ALADDIN</text><text x="45" y="163" font-size="50" letter-spacing="-2">Shawki Aladdin</text><text x="48" y="207" font-size="25" fill="#b6bdc6">Software engineer &amp; founder.</text><text x="48" y="260" font-size="16" fill="#b6bdc6">CTO at Digital Harbor. Founder of gitroots.</text><text x="48" y="291" font-size="14" fill="#9da6b1">AI · Infrastructure · Distributed systems · Security</text><text x="48" y="341" font-size="12" fill="#9da6b1">Egyptian · Based in Riyadh</text></g><path d="M48 395H1152" stroke="#303438"/><g transform="translate(780 90) scale(0.48)" fill="none" stroke="#78897e" stroke-width=".8"><path d="M-170 0H170 M0 -105V105 M-120 -70L120 70" stroke="#46524a" stroke-dasharray="1 7"/><g transform="rotate(24) skewY(-18)"><path d="M-28 -26L0 -40L30 -22V26L0 42L-28 24Z M-28 -26L0 -9L30 -22 M0 -9V42 M-28 24L0 8L30 26"/><path d="M-32 -25H-132V27H-32Z M32 -25H132V27H32Z M-112 -25V27 M-92 -25V27 M-72 -25V27 M-52 -25V27 M52 -25V27 M72 -25V27 M92 -25V27 M112 -25V27 M-132 -8H-32 M-132 10H-32 M32 -8H132 M32 10H132 M0 -40V-76 M-12 -76Q0 -54 12 -76"/></g></g></svg>