<path d="M1106 257l51 22v108l-51-26zM1184 286l51-19v102l-51 21z" class="fine"/>
<path d="M1122 270v101m19-91v100m43-65l51-19m-51 46 51-19" class="fine"/>
<circle cx="1098" cy="249" r="3" fill="#9eaeb2"/><circle cx="1242" cy="255" r="3" fill="#9eaeb2"/><circle cx="1178" cy="395" r="3" fill="#9eaeb2"/>
<!-- antenna -->
<path d="M1171 213V149" stroke="#d0d8d8" stroke-width="2"/><ellipse cx="1171" cy="149" rx="56" ry="18" class="line"/><path d="M1115 149Q1171 203 1227 149M1171 130V97M1140 137l31 44 31-44" class="fine"/>
<circle cx="1171" cy="98" r="3" fill="#cad6d5"/>
</g>
<circle cx="870" cy="312" r="4" fill="#96a9af"/><circle cx="1482" cy="270" r="4" fill="#96a9af"/>
<g class="t" fill="#637079" font-size="12" letter-spacing="1"><text x="1365" y="117">AUTONOMOUS / SYSTEMS</text><text x="1365" y="136">RESEARCH PROTOTYPE</text><text x="1365" y="155">STATUS: EXPERIMENTAL</text></g>
<path d="M1343 106h-14v60" class="fine"/>
