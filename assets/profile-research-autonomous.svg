<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="580" viewBox="0 0 1600 580" role="img" aria-labelledby="title desc">
<title id="title">Research: Autonomous Software Repair for Space Systems</title><desc id="desc">Ongoing experimental research into independently validated autonomous repairs for disconnected spacecraft software, illustrated by a technical satellite blueprint.</desc>
<defs>
<linearGradient id="bg" x2="1" y2="1"><stop stop-color="#0c1014"/><stop offset="1" stop-color="#080c10"/></linearGradient>
<radialGradient id="glow"><stop stop-color="#263e3c" stop-opacity=".32"/><stop offset="1" stop-color="#0a0e11" stop-opacity="0"/></radialGradient>
<pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r=".65" fill="#273238" opacity=".45"/></pattern>
<style>
.t{font-family:Arial,Helvetica,sans-serif}.muted{fill:#aeb9c1}.fine{stroke:#667780;stroke-width:1;fill:none;opacity:.52}.line{stroke:#b8c8ca;stroke-width:1.5;fill:none;stroke-linejoin:round}.grid{stroke:#91a6a8;stroke-width:1;opacity:.5}
.orbit{stroke-dasharray:8 9;animation:move 35s linear infinite}@keyframes move{to{stroke-dashoffset:-340}}.sat{transform-origin:1220px 292px;animation:float 7s ease-in-out infinite}@keyframes float{50%{transform:translateY(-9px)}}@media(prefers-reduced-motion:reduce){.orbit,.sat{animation:none}}
</style>
</defs>
<rect width="1600" height="580" rx="18" fill="url(#bg)"/><rect x="1" y="1" width="1598" height="578" rx="18" fill="none" stroke="#293239"/>
<rect width="1600" height="580" rx="18" fill="url(#dots)"/><ellipse cx="1200" cy="300" rx="500" ry="335" fill="url(#glow)"/>
<g class="t">
<text x="72" y="72" font-size="17" fill="#c0c9d0" letter-spacing="3">///  RESEARCH</text>
<path d="M275 65H620" stroke="#46535b" stroke-width="1"/><circle cx="644" cy="65" r="5" fill="#86c69b"/><text x="662" y="72" font-size="16" letter-spacing="2" fill="#91cba7">ONGOING</text>
<text x="72" y="154" font-weight="700" font-size="49" fill="#f1f4f5">Autonomous Software Repair</text>
<text x="72" y="212" font-weight="700" font-size="49" fill="#f1f4f5">for Space Systems</text>
<text x="72" y="269" font-size="22" class="muted">Exploring how spacecraft software can identify, validate,</text>
<text x="72" y="301" font-size="22" class="muted">and safely recover from vulnerabilities without relying</text>
<text x="72" y="333" font-size="22" class="muted">on continuous ground connectivity.</text>
<text x="72" y="383" font-size="17" fill="#84939d">Experimental prototype with synthetic test scenarios.</text>
<text x="72" y="409" font-size="17" fill="#84939d">AI-generated patches and spacecraft deployment remain unvalidated.</text>
<rect x="72" y="440" rx="13" width="180" height="37" fill="#12191c" stroke="#32413c"/><text x="88" y="465" font-size="15" fill="#c0cacb">〈/〉 Candidate Repair</text>
<rect x="263" y="440" rx="13" width="219" height="37" fill="#12191c" stroke="#32413c"/><text x="279" y="465" font-size="15" fill="#c0cacb">◇ Independent Validation</text>
<rect x="493" y="440" rx="13" width="187" height="37" fill="#12191c" stroke="#32413c"/><text x="509" y="465" font-size="15" fill="#c0cacb">▥ Controlled Activation</text>
<text x="72" y="525" font-weight="600" font-size="23" fill="#94d2a9">Satellite Repair Lab ↗</text><path d="M72 536H302" stroke="#79b88d" stroke-width="1.5"/>
</g>
<g transform="translate(40 0)">
<ellipse class="fine orbit" cx="1160" cy="298" rx="320" ry="143" transform="rotate(15 1160 298)"/><ellipse class="fine" cx="1160" cy="298" rx="240" ry="102" transform="rotate(-23 1160 298)"/>
<path class="fine" d="M1150 76V501M870 300H1490"/><path class="fine" d="M867 169v-24m-12 12h24M1487 417v-26m-13 13h26"/>
