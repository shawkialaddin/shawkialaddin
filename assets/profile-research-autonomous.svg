<g class="grid"><path d="M1280 255V398M1310 267V410M1340 279V422M1370 291V434M1400 303V446M1430 316V458M1250 272L1463 358M1250 300L1463 386M1250 328L1463 414M1250 357L1463 443"/></g>
<!-- main chassis -->
