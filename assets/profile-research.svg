<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="358" viewBox="0 0 1200 358" role="img" aria-labelledby="title"><title id="title">Ongoing research: offline repair for satellite software</title><rect width="1200" height="358" fill="#101114"/><style>text{font-family:Arial,sans-serif}</style><text x="48" y="35" fill="#edeeec" font-size="11" letter-spacing="3.5">RESEARCH</text><text x="48" y="79" fill="#accbb0" font-size="11" letter-spacing="2.5">ONGOING</text><text x="48" y="121" fill="#edeeec" font-size="28" letter-spacing="-.6">Offline repair for satellite software</text><text x="48" y="162" fill="#abb4bf" font-size="17" >Investigating independent patch acceptance for satellite-inspired</text><text x="48" y="190" fill="#abb4bf" font-size="17" >applications, separating candidate repair from activation.</text><text x="48" y="237" fill="#959fa9" font-size="14" >Experimental prototype using synthetic fixtures.</text><text x="48" y="262" fill="#959fa9" font-size="14" >AI-generated repair and spacecraft integration remain unevaluated.</text><text x="48" y="306" fill="#accbb0" font-size="14" >Satellite Repair Lab ↗</text><g transform="translate(972 186) scale(1.07)" fill="none" stroke="#78897e" stroke-width=".8"><path d="M-170 0H170 M0 -105V105 M-120 -70L120 70" stroke="#46524a" stroke-dasharray="1 7"/><g transform="rotate(24) skewY(-18)"><path d="M-28 -26L0 -40L30 -22V26L0 42L-28 24Z M-28 -26L0 -9L30 -22 M0 -9V42 M-28 24L0 8L30 26"/><path d="M-32 -25H-132V27H-32Z M32 -25H132V27H32Z M-112 -25V27 M-92 -25V27 M-72 -25V27 M-52 -25V27 M52 -25V27 M72 -25V27 M92 -25V27 M112 -25V27 M-132 -8H-32 M-132 10H-32 M32 -8H132 M32 10H132 M0 -40V-76 M-12 -76Q0 -54 12 -76"/></g></g><path d="M48 350H1152" stroke="#303438"/></svg>