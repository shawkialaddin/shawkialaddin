name: Render animated research banner
on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/render-research-gif.yml"
      - "scripts/render_research_gif.py"
permissions:
  contents: write
jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install Pillow cairosvg
      - run: python scripts/render_research_gif.py
      - name: Commit generated GIF and update README
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('README.md')
          s=p.read_text()
          s=s.replace('assets/profile-research-autonomous.svg', 'assets/profile-research-animated.gif')
          p.write_text(s)
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/profile-research-animated.gif assets/research-satellite-only.gif README.md
          git diff --cached --quiet || git commit -m "Render true animated research GIF"
          git push
