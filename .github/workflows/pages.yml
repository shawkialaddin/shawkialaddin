name: Personal page
on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '17 3 * * *'
permissions:
  contents: read
concurrency:
  group: personal-pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Refresh public contribution calendar
        run: |
          if ! python scripts/refresh_activity.py; then
            echo '::warning::Contribution refresh failed. Keeping the last valid snapshot.'
          fi
      - name: Check page and calendar
        run: |
          python -m unittest discover -s tests -v
          node --check site/app.js
          node --check site/portrait.js
          node --test tests/calendar.test.cjs
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v5
      - name: Deploy personal page
        id: deployment
        uses: actions/deploy-pages@v4
